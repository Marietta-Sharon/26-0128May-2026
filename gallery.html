<head>
    <meta charset="UTF-8">
    <title>Electronics Gallery</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right,#0f2027,#203a43,#2c5364);
            color:white;
        }

        header{
            background:linear-gradient(to right,#00c6ff,#0072ff);
            text-align:center;
            padding:20px;
        }

        nav{
            background-color:#111;
            padding:15px;
        }

        nav ul{
            list-style:none;
            margin:0;
            padding:0;
            text-align:center;
        }

        nav ul li{
            display:inline;
            margin:0 15px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        nav ul li a:hover{
            color:cyan;
        }

        section{
            margin:20px;
            padding:20px;
            background-color:rgba(255,255,255,0.1);
            border-radius:12px;
        }

        h2{
            text-align:center;
            color:#00c6ff;
        }

        .gallery-grid{
            display:grid;
            grid-template-columns:repeat(2, 1fr);
            gap:20px;
        }

        figure{
            margin:0;
            text-align:center;
        }

        figure img{
            width:100%;
            max-width:350px;
            border-radius:10px;
        }

        figcaption{
            margin-top:10px;
        }

        video{
            display:block;
            margin:auto;
            border-radius:10px;
        }

        footer{
            background-color:#111;
            text-align:center;
            padding:15px;
        }
    </style>
</head>
