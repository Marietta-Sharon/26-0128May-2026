<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ElectroTech Electronics</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(to right,#0f2027,#203a43,#2c5364);
            color:white;
        }

        header{
            background:linear-gradient(to right,#00c6ff,#0072ff);
            text-align:center;
            padding:20px;
        }

        nav{
            background-color:#111;
            padding:15px;
        }

        nav ul{
            list-style:none;
            margin:0;
            padding:0;
            text-align:center;
        }

        nav ul li{
            display:inline;
            margin:0 15px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        nav ul li a:hover{
            color:cyan;
        }

        section{
            max-width:800px;
            margin:30px auto;
            padding:25px;
            background-color:rgba(255,255,255,0.1);
            border-radius:12px;
        }

        h2,h3{
            text-align:center;
            color:#00c6ff;
        }

        p{
            text-align:center;
        }

        label{
            font-weight:bold;
        }

        input[type="text"],
        input[type="email"],
        textarea{
            width:100%;
            padding:10px;
            border:none;
            border-radius:5px;
            margin-top:5px;
            box-sizing:border-box;
        }

        textarea{
            resize:vertical;
        }

        input[type="submit"]{
            background-color:#00c6ff;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:5px;
            cursor:pointer;
            font-weight:bold;
        }

        input[type="submit"]:hover{
            background-color:#0072ff;
        }

        footer{
            background-color:#111;
            text-align:center;
            padding:15px;
            margin-top:30px;
        }
    </style>
</head>

<body>

<header>
    <h1>ElectroTech Electronics</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="products.html">Services/Products</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<section id="contact">
    <h2>Contact Us</h2>

    <p><strong>Address:</strong> Nairobi, Kenya</p>
    <p><strong>Phone:</strong> +254 700 123 456</p>
    <p><strong>Email:</strong> info@electrotechelectronics.com</p>

    <h3>Send Us a Message</h3>

    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5"></textarea><br><br>

        <input type="submit" value="Send Message">
    </form>
</section>

<footer>
    <p>&copy; 2026 ElectroTech Electronics. All Rights Reserved.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
